# BALTER BREWING — KEG TRACKER
# Cloudflare Worker configuration (deployed with `npx wrangler deploy`).
#
# Serves the static site as Worker assets and runs worker.js for the one
# API route the app needs (/api/keg-state, for multi-device sync).
#
# `name` must match your Worker name (kegtracker for
# kegtracker.paul-778.workers.dev).
#
# The KV namespace has NO id on purpose: Wrangler's automatic provisioning
# creates it on the first deploy and reuses it on every deploy after that.

name = "kegtracker"
main = "worker.js"
compatibility_date = "2026-11-18"

[assets]
directory = "."
binding = "ASSETS"

[[kv_namespaces]]
binding = "KEG_KV"
