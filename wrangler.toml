# Tells Cloudflare's unified Wrangler CLI that this is a Pages project
# (static site + the functions/ folder), not a plain Worker — fixes the
# "looks like a Cloudflare Pages project... Automatic configuration cannot
# migrate Pages Functions to Workers" build error.
#
# IMPORTANT: change `name` below to match your actual Cloudflare Pages
# project name exactly (find it in the dashboard URL, or under your
# project's Settings — General). If it doesn't match, the deploy will
# either fail or create/target a different project.
name = "kegtracker"
pages_build_output_dir = "."
compatibility_date = "2026-11-18"
